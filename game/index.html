<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Tides — Spot the Difference</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">TWIN TIDES</span>
    <span class="sub">Spot the Difference</span>
  </div>
  <div class="top-right">
    <span id="bestText" class="best"></span>
    <button id="muteBtn" class="chip-btn" type="button">Sound on [M]</button>
  </div>
</header>

<div id="hud" class="hud">
  <div class="hud-left">
    <span id="levelChip" class="level-chip">Level 1 / 3 — Harbor at Dawn</span>
    <span id="levelName" class="level-name">Sunrise over the little fishing harbor</span>
  </div>
  <div class="hud-mid">
    <span id="counterText" class="counter">FOUND 0/7 · 7 LEFT</span>
    <span id="dots" class="dots" aria-label="differences found"></span>
  </div>
  <div class="hud-right">
    <div class="timer">
      <div id="timerFill" class="timer-fill"></div>
      <span id="timerText" class="timer-text">150s</span>
    </div>
    <span id="scoreText" class="score">Score 0</span>
    <button id="hintBtn" class="chip-btn hint" type="button">Hint (3) [H]</button>
  </div>
</div>

<main id="stage" class="stage">
  <div class="panel">
    <canvas id="panelA" width="540" height="540" aria-label="Left picture: the original harbor scene"></canvas>
    <span class="panel-tag">A · Original</span>
  </div>
  <div class="panel">
    <canvas id="panelB" width="540" height="540" aria-label="Right picture: the twin harbor scene"></canvas>
    <span class="panel-tag">B · Twin</span>
  </div>
  <div id="crosshair" class="crosshair" style="display:none"></div>
  <div id="floaters" class="floaters"></div>
  <div id="overlay" class="overlay hidden"></div>
</main>

<footer class="help">
  <span>Click a difference on either picture</span>
  <span>Arrow keys move the crosshair · Space selects · Tab switches picture</span>
  <span>H hint · R restart · M sound · Esc title</span>
</footer>

<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
